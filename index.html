/* === SPRÁVCE DOMU PWA === */

const AUTH={
  KEY:"sd_users",DK:function(u){return"sd_data_"+u},
  getUsers:function(){try{return JSON.parse(localStorage.getItem(this.KEY)||"[]")}catch(e){return[]}},
  saveUsers:function(u){localStorage.setItem(this.KEY,JSON.stringify(u))},
  addUser:function(u,p){var us=this.getUsers();if(us.find(function(x){return x.username===u}))return false;us.push({username:u,ph:this.hash(p),at:new Date().toISOString()});this.saveUsers(us);return true},
  verify:function(u,p){var h=this.hash(p);return this.getUsers().find(function(x){return x.username===u&&x.ph===h})},
  hash:function(s){var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*0x01000193)>>>0}return h.toString(16)},
  session:{get:function(){return localStorage.getItem("sd_session")},set:function(u){localStorage.setItem("sd_session",u)},clear:function(){localStorage.removeItem("sd_session")}}
};

/* GITHUB GIST CONFIG */
var GH_TOKEN=localStorage.getItem('sd_gh_token')||'';
var GH_GIST_ID=localStorage.getItem('sd_gist_id')||'';

function ghRequest(method, path, body){
  return fetch('https://api.github.com'+path,{
    method:method,
    headers:{
      'Authorization':'Bearer '+GH_TOKEN,
      'Accept':'application/vnd.github+json',
      'Content-Type':'application/json',
      'User-Agent':'SpravceDomu/1.0'
    },
    body:body?JSON.stringify(body):undefined
  }).then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error(t)});
    return r.json();
  });
}

function ensureGist(){
  if(GH_GIST_ID) return Promise.resolve(GH_GIST_ID);
  // Create new gist
  return ghRequest('POST','/gists',{
    description:'Správce domu – data aplikace',
    public:false,
    files:{'sd-data.json':{content:JSON.stringify({users:{}},null,2)}}
  }).then(function(g){
    GH_GIST_ID=g.id;
    localStorage.setItem('sd_gist_id',GH_GIST_ID);
    return GH_GIST_ID;
  });
}

var DB={
  load:function(u){
    return ensureGist().then(function(gid){
      return ghRequest('GET','/gists/'+gid);
    }).then(function(gist){
      var raw=gist.files['sd-data.json']&&gist.files['sd-data.json'].content;
      if(!raw)return DB.def();
      var all=JSON.parse(raw);
      return (all.users&&all.users[u])||DB.def();
    }).catch(function(e){
      console.error('Load error',e);
      return DB.def();
    });
  },
  save:function(u,d){
    return ensureGist().then(function(gid){
      // First read current data, then merge
      return ghRequest('GET','/gists/'+gid).then(function(gist){
        var raw=gist.files['sd-data.json']&&gist.files['sd-data.json'].content;
        var all=raw?JSON.parse(raw):{users:{}};
        if(!all.users)all.users={};
        all.users[u]=d;
        return ghRequest('PATCH','/gists/'+gid,{
          files:{'sd-data.json':{content:JSON.stringify(all,null,2)}}
        });
      });
    }).then(function(){return true})
    .catch(function(e){console.error('Save error',e);return false});
  },
  def:function(){return{
    revisions:[
      {id:1,type:"Elektroinstalace",lastDate:"2023-03-15",intervalYears:5,company:"Elektro Nov\u00e1k s.r.o.",note:"Dle \u010cSN 33 1500"},

    ],
    contacts:[
      {id:1,name:"Elektro Nov\u00e1k s.r.o.",phone:"+420 466 123 456",email:"novak@elektro.cz",category:"Elektro",note:""},
      {id:2,name:"GasServis Pardubice",phone:"+420 466 654 321",email:"info@gasservis.cz",category:"Plyn/Top\u00een\u00ed",note:"Havarijní linka 24/7"},

    primary:"background:#4f8ef7;color:#fff;border:none;",
    danger:"background:#7f1d1d;color:#ef4444;border:1px solid #ef444444;",
    ghost:"background:transparent;color:#94a3b8;border:1px solid #2a2f45;",
    success:"background:#14532d;color:#22c55e;border:1px solid #22c55e44;"
  };
  return (styles[v]||styles.primary)+"border-radius:10px;padding:10px 18px;font-size:15px;font-weight:600;cursor:pointer;"
};

var S={tab:"dashboard",data:null,df:"Vše",fy:new Date().getFullYear(),sq:"",user:null,aMode:"login",aErr:""};
var svT=null;

function initSession(){
  var u=AUTH.session.get();
  if(u&&AUTH.getUsers().find(function(x){return x.username===u})){
    S.user=u;showLoading(true);
    return DB.load(u).then(function(d){S.data=d;showLoading(false);});
  }
  return Promise.resolve();
}
function showLoading(on){
  var el=document.getElementById('ld');
  if(on&&!el){el=document.createElement('div');el.id='ld';el.style.cssText='position:fixed;inset:0;background:#0f1117;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:16px';el.innerHTML='<div style="font-size:48px">&#127968;</div><div style="color:#4f8ef7;font-size:16px;font-weight:600">Načítám data...</div>';document.body.appendChild(el);}
  else if(!on&&el){el.remove();}
}
function mut(fn){
  fn(S.data);clearTimeout(svT);
  svT=setTimeout(function(){
    DB.save(S.user,S.data).then(function(ok){
      var sv=document.getElementById('sv');
      if(sv){
        sv.style.color=ok?'#22c55e':'#ef4444';
        sv.textContent=ok?'✓ Uloženo':'⚠ Chyba - data velká?';
        sv.style.opacity='1';
        setTimeout(function(){sv.style.opacity='0';},3000);
      }
    });
  },600);
  render();
}
function flash(){var e=document.getElementById("sv");if(e){e.style.opacity="1";setTimeout(function(){e.style.opacity="0"},1500)}}
function setTab(t){S.tab=t;window.scrollTo(0,0);render()}
function logout(){AUTH.session.clear();S.user=null;S.data=null;render()}
function g(id){var el=document.getElementById(id);return el?el.value:""}

function renderSetup(){
  document.getElementById('app').innerHTML=`
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#0f1117">
    <div style="width:100%;max-width:400px">
      <div style="text-align:center;margin-bottom:32px">
        <div style="font-size:52px;margin-bottom:12px">🏢</div>
        <div style="color:#e2e8f0;font-size:24px;font-weight:800">Správce domu</div>
        <div style="color:#64748b;font-size:14px;margin-top:6px">Jednorázové nastavení</div>
      </div>
      <div style="background:#1a1d27;border:1px solid #2a2f45;border-radius:20px;padding:28px 24px">
        <div style="color:#e2e8f0;font-weight:700;font-size:16px;margin-bottom:8px">GitHub token</div>
        <div style="color:#64748b;font-size:13px;margin-bottom:16px;line-height:1.5">
          Pro sdílení dat zadej GitHub Personal Access Token.<br>
          Vytvoříš ho na: <a href="https://github.com/settings/tokens" target="_blank" style="color:#4f8ef7">github.com/settings/tokens</a><br>
          → Generate new token (classic) → zaškrtni <b style="color:#e2e8f0">gist</b>
        </div>
        <input id="setup-token" type="password" placeholder="ghp_..." style="background:#0f1117;border:1px solid #2a2f45;border-radius:10px;color:#e2e8f0;padding:12px 14px;font-size:15px;width:100%;outline:none;margin-bottom:12px;" onkeydown="if(event.key==='Enter')saveSetup()"/>
        <button onclick="saveSetup()" style="background:#4f8ef7;color:#fff;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;width:100%;">Uložit a pokračovat</button>

    </div>
  </div>`;
  setTimeout(()=>document.getElementById('setup-token')?.focus(),50);
}

function saveSetup(){
  var t=(document.getElementById('setup-token')||{value:''}).value.trim();
  if(!t||!t.startsWith('ghp_')){alert('Zadej platný token začínající ghp_');return}
  GH_TOKEN=t;
  localStorage.setItem('sd_gh_token',t);
  render();
}

function showAuthErr(msg){
  var el=document.getElementById('auth-err');
  if(el){
    el.textContent='⚠ '+msg;
    el.style.display='block';
  }
}

function renderAuth(){
  var isL=S.aMode==="login";
  var hasU=AUTH.getUsers().length>0;
  document.getElementById("app").innerHTML=
    '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">'+
    '<div style="width:100%;max-width:380px">'+
    '<div style="text-align:center;margin-bottom:36px"><div style="font-size:52px;margin-bottom:12px">🏢</div>'+
    '<div style="color:#e2e8f0;font-size:26px;font-weight:800">Správce domu</div>'+
    '<div style="color:#64748b;font-size:14px;margin-top:4px">Evidence a správa budovy</div></div>'+
    '<div style="background:#1a1d27;border:1px solid #2a2f45;border-radius:20px;padding:28px 24px">'+
    '<div style="display:flex;background:#0f1117;border-radius:10px;padding:4px;margin-bottom:24px">'+
    '<button onclick="S.aMode=\'login\';S.aErr=\'\';render()" style="flex:1;background:'+(isL?"#1a1d27":"transparent")+';color:'+(isL?"#e2e8f0":"#64748b")+';border:none;border-radius:8px;padding:9px;font-size:14px;font-weight:'+(isL?700:400)+';cursor:pointer">Přihlásit se</button>'+
    '<button onclick="S.aMode=\'register\';S.aErr=\'\';render()" style="flex:1;background:'+(!isL?"#1a1d27":"transparent")+';color:'+(!isL?"#e2e8f0":"#64748b")+';border:none;border-radius:8px;padding:9px;font-size:14px;font-weight:'+(!isL?700:400)+';cursor:pointer">Registrovat</button></div>'+
    '<div style="display:flex;flex-direction:column;gap:12px">'+
    '<div><label style="color:#64748b;font-size:12px;display:block;margin-bottom:6px">Uživatelské jméno</label>'+
    '<input id="au" type="text" placeholder="správce" style="'+IS+'" autocomplete="username" autocapitalize="none"/></div>'+
    '<div><label style="color:#64748b;font-size:12px;display:block;margin-bottom:6px">Heslo</label>'+
    '<input id="ap" type="password" placeholder="••••••••" style="'+IS+'" onkeydown="if(event.key===\'Enter\')'+(isL?"doLogin()":"doReg()")+'"/></div>'+
    (!isL?'<div><label style="color:#64748b;font-size:12px;display:block;margin-bottom:6px">Heslo znovu</label><input id="ap2" type="password" placeholder="••••••••" style="'+IS+'" onkeydown="if(event.key===\'Enter\')doReg()"/></div>':'')+
    '</div>'+
    (S.aErr?'<div style="background:#7f1d1d;border:1px solid #ef444444;border-radius:10px;padding:10px 14px;margin-top:14px;color:#ef4444;font-size:14px">⚠ '+esc(S.aErr)+'</div>':'')+
    '<button onclick="'+(isL?"doLogin()":"doReg()")+'" style="'+BS("primary")+'width:100%;margin-top:18px;">'+(isL?"Přihlásit se":"Vytvořit účet")+'</button>'+
    (isL&&!hasU?'<div style="color:#64748b;font-size:12px;text-align:center;margin-top:14px">Zatím žádný účet? Přepni na <b>Registrovat</b></div>':'')+
    '</div><div style="color:#64748b;font-size:11px;text-align:center;margin-top:16px">Data jsou uložena pouze v tomto zařízení</div></div></div>';
  setTimeout(function(){var el=document.getElementById("au");if(el)el.focus()},50);
}

function doLogin(){
  var u=(document.getElementById("au")||{value:""}).value.trim();
  var p=(document.getElementById("ap")||{value:""}).value;
  if(!u||!p){showAuthErr("Vyplňte uživatelské jméno a heslo");return}
  if(!AUTH.verify(u,p)){showAuthErr("Nesprávné jméno nebo heslo");return}
  AUTH.session.set(u);S.user=u;showLoading(true);DB.load(u).then(function(d){S.data=d;showLoading(false);S.aErr="";render();});
}
function doReg(){
  var u=(document.getElementById("au")||{value:""}).value.trim();
  var p=(document.getElementById("ap")||{value:""}).value;
  var p2=(document.getElementById("ap2")||{value:""}).value;
  if(!u||!p){showAuthErr("Vyplňte všechna pole");return}
  if(u.length<3){showAuthErr("Jméno musí mít alespoň 3 znaky");return}
  if(p.length<4){showAuthErr("Heslo musí mít alespoň 4 znaky");return}
  if(p!==p2){showAuthErr("Hesla se neshodují");return}
  if(!AUTH.addUser(u,p)){showAuthErr("Toto uživatelské jméno je již obsazeno");return}
  AUTH.session.set(u);S.user=u;showLoading(true);DB.load(u).then(function(d){S.data=d;showLoading(false);S.aErr="";render();});
}

function handleDrop(e){e.preventDefault();var dz=document.querySelector(".dz");if(dz)dz.classList.remove("over");processFiles(Array.from(e.dataTransfer.files))}
function handleFileInput(inp){processFiles(Array.from(inp.files));inp.value=""}
function processFiles(files){
  files.forEach(function(file){
    var n=file.name.toLowerCase();
    var type=n.includes("reviz")?"Revizní zpráva":n.includes("protokol")?"Protokol":n.includes("smlouva")||n.includes("pojist")?"Smlouva":"Jiné";
    showSaveStatus("⏳ Nahrávám...", "#f97316");
    if(file.type.startsWith("image/")){
      // Compress image before saving
      var reader=new FileReader();
      reader.onload=function(e){
        var img=new Image();
        img.onload=function(){
          var canvas=document.createElement("canvas");
          var MAX=1200;
          var w=img.width, h=img.height;
          if(w>h&&w>MAX){h=Math.round(h*MAX/w);w=MAX;}
          else if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
          canvas.width=w; canvas.height=h;
          canvas.getContext("2d").drawImage(img,0,0,w,h);
          var compressed=canvas.toDataURL("image/jpeg",0.75);
          var sz=Math.round(compressed.length*0.75);
          mut(function(d){d.documents.push({id:uid(),name:file.name,type:type,date:today(),note:"",fileData:compressed,fileType:"image/jpeg",fileSize:sz})});
        };
        img.src=e.target.result;
      };
      reader.readAsDataURL(file);
    } else {
      // Non-image file — read as-is
      var reader=new FileReader();
      reader.onload=function(e){
        mut(function(d){d.documents.push({id:uid(),name:file.name,type:type,date:today(),note:"",fileData:e.target.result,fileType:file.type,fileSize:file.size})});
      };
      reader.readAsDataURL(file);
    }
  });
}

function showSaveStatus(msg, color){
  var sv=document.getElementById("sv");
  if(sv){sv.style.color=color||"#22c55e";sv.textContent=msg;sv.style.opacity="1";}
}
function dlDoc(id){var d=(S.data.documents||[]).find(function(x){return x.id===id});if(!d||!d.fileData)return;var a=document.createElement("a");a.href=d.fileData;a.download=d.name;a.click()}

  else if(type==="rev-edit"){var r=d.revisions.find(function(x){return x.id===id});if(!r)return;html=mWrap("Upravit revizi",inp("ft","Typ *","text",r.type)+lbl("Datum poslední revize")+inp("fd","","date",r.lastDate)+inp("fi2","Interval (roky)","number",r.intervalYears)+inp("fc","Firma","text",r.company)+ta("fn","Poznámka",r.note),"saveRev("+id+")")}

function closeM(){var e=document.getElementById("modal-root");if(e)e.remove()}
function saveRev(id){var t=g("ft").trim();if(!t)return;var rec={type:t,lastDate:g("fd")||today(),intervalYears:Number(g("fi2"))||1,company:g("fc"),note:g("fn")};mut(function(d){if(id)d.revisions=d.revisions.map(function(x){return x.id===id?Object.assign({},x,rec):x});else d.revisions.push(Object.assign({id:uid()},rec))});closeM()}
function saveCon(id){var n=g("fn2").trim();if(!n)return;var rec={name:n,phone:g("fp"),email:g("fe"),category:g("fk"),note:g("fno")};mut(function(d){if(id)d.contacts=d.contacts.map(function(x){return x.id===id?Object.assign({},x,rec):x});else d.contacts.push(Object.assign({id:uid()},rec))});closeM()}
function saveDef(id){var desc=g("fde").trim();if(!desc)return;var rec={date:g("fd2")||today(),description:desc,status:g("fst")||"Nová",cost:Number(g("fco"))||0,note:g("fno2")};mut(function(d){if(id)d.defects=d.defects.map(function(x){return x.id===id?Object.assign({},x,rec):x});else d.defects.push(Object.assign({id:uid()},rec))});closeM()}
function saveFin(){var desc=g("fde2").trim(),amt=Number(g("fam"));if(!desc||!amt)return;mut(function(d){d.finances.push({id:uid(),date:g("fd3")||today(),description:desc,category:g("fca")||"Jiné",amount:amt})});closeM()}
function saveDoc(){var n=g("fna").trim();if(!n)return;mut(function(d){d.documents.push({id:uid(),name:n,type:g("fty")||"Jiné",date:g("fd4")||today(),note:g("fno3"),fileData:null,fileType:null,fileSize:null})});closeM()}

  el.id='confirm-root';

  };
}

const AUTH={
  KEY:"sd_users",DK:function(u){return"sd_data_"+u},
  getUsers:function(){try{return JSON.parse(localStorage.getItem(this.KEY)||"[]")}catch(e){return[]}},
  saveUsers:function(u){localStorage.setItem(this.KEY,JSON.stringify(u))},
  addUser:function(u,p){var us=this.getUsers();if(us.find(function(x){return x.username===u}))return false;us.push({username:u,ph:this.hash(p),at:new Date().toISOString()});this.saveUsers(us);return true},
  verify:function(u,p){var h=this.hash(p);return this.getUsers().find(function(x){return x.username===u&&x.ph===h})},
  hash:function(s){var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*0x01000193)>>>0}return h.toString(16)},
  session:{get:function(){return localStorage.getItem("sd_session")},set:function(u){localStorage.setItem("sd_session",u)},clear:function(){localStorage.removeItem("sd_session")}}
};

/* GITHUB GIST CONFIG */
var GH_TOKEN=localStorage.getItem('sd_gh_token')||'';
var GH_GIST_ID=localStorage.getItem('sd_gist_id')||'';

function ghRequest(method, path, body){
  return fetch('https://api.github.com'+path,{
    method:method,
    headers:{
      'Authorization':'Bearer '+GH_TOKEN,
      'Accept':'application/vnd.github+json',
      'Content-Type':'application/json',
      'User-Agent':'SpravceDomu/1.0'
    },
    body:body?JSON.stringify(body):undefined
  }).then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error(t)});
    return r.json();
  });
}

function ensureGist(){
  if(GH_GIST_ID) return Promise.resolve(GH_GIST_ID);
  // Create new gist
  return ghRequest('POST','/gists',{
    description:'Správce domu – data aplikace',
    public:false,
    files:{'sd-data.json':{content:JSON.stringify({users:{}},null,2)}}
  }).then(function(g){
    GH_GIST_ID=g.id;
    localStorage.setItem('sd_gist_id',GH_GIST_ID);
    return GH_GIST_ID;
  });
}

var DB={
  load:function(u){
    return ensureGist().then(function(gid){
      return ghRequest('GET','/gists/'+gid);
    }).then(function(gist){
      var raw=gist.files['sd-data.json']&&gist.files['sd-data.json'].content;
      if(!raw)return DB.def();
      var all=JSON.parse(raw);
      return (all.users&&all.users[u])||DB.def();
    }).catch(function(e){
      console.error('Load error',e);
      return DB.def();
    });

  save:function(u,d){
    return ensureGist().then(function(gid){
      // First read current data, then merge
      return ghRequest('GET','/gists/'+gid).then(function(gist){
        var raw=gist.files['sd-data.json']&&gist.files['sd-data.json'].content;
        var all=raw?JSON.parse(raw):{users:{}};
        if(!all.users)all.users={};
        all.users[u]=d;
        return ghRequest('PATCH','/gists/'+gid,{
          files:{'sd-data.json':{content:JSON.stringify(all,null,2)}}
        });
      });

var esc=function(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")};
var fmtSize=function(b){return b>1048576?(b/1048576).toFixed(1)+" MB":b>1024?Math.round(b/1024)+" KB":b+" B"};

var ST={
  ok:     {label:"V pořádku",color:"#22c55e",bg:"#14532d",icon:"✓"},
  warning:{label:"Blíží se", color:"#f97316",bg:"#7c2d12",icon:"!"},
  critical:{label:"Kritické",color:"#ef4444",bg:"#7f1d1d",icon:"!!"},
  overdue:{label:"Po termínu",color:"#ef4444",bg:"#7f1d1d",icon:"✗"}
};

var BS=function(v){
  var styles={
    primary:"background:#4f8ef7;color:#fff;border:none;",
    danger:"background:#7f1d1d;color:#ef4444;border:1px solid #ef444444;",
    ghost:"background:transparent;color:#94a3b8;border:1px solid #2a2f45;",
    success:"background:#14532d;color:#22c55e;border:1px solid #22c55e44;"
  };
  return (styles[v]||styles.primary)+"border-radius:10px;padding:10px 18px;font-size:15px;font-weight:600;cursor:pointer;"
};

var S={tab:"dashboard",data:null,df:"Vše",fy:new Date().getFullYear(),sq:"",user:null,aMode:"login",aErr:""};
var svT=null;

function initSession(){
  var u=AUTH.session.get();
  if(u&&AUTH.getUsers().find(function(x){return x.username===u})){
    S.user=u;showLoading(true);
    return DB.load(u).then(function(d){S.data=d;showLoading(false);});
  }
  return Promise.resolve();
}
function showLoading(on){
  var el=document.getElementById('ld');
  if(on&&!el){el=document.createElement('div');el.id='ld';el.style.cssText='position:fixed;inset:0;background:#0f1117;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:16px';el.innerHTML='<div style="font-size:48px">&#127968;</div><div style="color:#4f8ef7;font-size:16px;font-weight:600">Načítám data...</div>';document.body.appendChild(el);}
  else if(!on&&el){el.remove();}
}
function mut(fn){
  fn(S.data);clearTimeout(svT);
  svT=setTimeout(function(){
    DB.save(S.user,S.data).then(function(ok){
      var sv=document.getElementById('sv');
      if(sv){
        sv.style.color=ok?'#22c55e':'#ef4444';
        sv.textContent=ok?'✓ Uloženo':'⚠ Chyba - data velká?';
        sv.style.opacity='1';
        setTimeout(function(){sv.style.opacity='0';},3000);
      }
    });
  },600);
  render();
}
function flash(){var e=document.getElementById("sv");if(e){e.style.opacity="1";setTimeout(function(){e.style.opacity="0"},1500)}}

function saveSetup(){
  var t=(document.getElementById('setup-token')||{value:''}).value.trim();
  if(!t||!t.startsWith('ghp_')){alert('Zadej platný token začínající ghp_');return}
  GH_TOKEN=t;
  localStorage.setItem('sd_gh_token',t);
  render();
}

function doLogin(){
  var u=(document.getElementById("au")||{value:""}).value.trim();
  var p=(document.getElementById("ap")||{value:""}).value;
  if(!u||!p){showAuthErr("Vyplňte uživatelské jméno a heslo");return}
  if(!AUTH.verify(u,p)){showAuthErr("Nesprávné jméno nebo heslo");return}
  AUTH.session.set(u);S.user=u;showLoading(true);DB.load(u).then(function(d){S.data=d;showLoading(false);S.aErr="";render();});
}
function doReg(){
  var u=(document.getElementById("au")||{value:""}).value.trim();
  var p=(document.getElementById("ap")||{value:""}).value;
  var p2=(document.getElementById("ap2")||{value:""}).value;
  if(!u||!p){showAuthErr("Vyplňte všechna pole");return}
  if(u.length<3){showAuthErr("Jméno musí mít alespoň 3 znaky");return}
  if(p.length<4){showAuthErr("Heslo musí mít alespoň 4 znaky");return}
  if(p!==p2){showAuthErr("Hesla se neshodují");return}
  if(!AUTH.addUser(u,p)){showAuthErr("Toto uživatelské jméno je již obsazeno");return}
  AUTH.session.set(u);S.user=u;showLoading(true);DB.load(u).then(function(d){S.data=d;showLoading(false);S.aErr="";render();});
}

function vFinances(){
  var recs=S.data.finances||[];
  var filt=recs.filter(function(r){return new Date(r.date).getFullYear()===S.fy}).sort(function(a,b){return new Date(b.date)-new Date(a.date)});

function handleDrop(e){e.preventDefault();var dz=document.querySelector(".dz");if(dz)dz.classList.remove("over");processFiles(Array.from(e.dataTransfer.files))}
function handleFileInput(inp){processFiles(Array.from(inp.files));inp.value=""}
function processFiles(files){
  files.forEach(function(file){
    var n=file.name.toLowerCase();
    var type=n.includes("reviz")?"Revizní zpráva":n.includes("protokol")?"Protokol":n.includes("smlouva")||n.includes("pojist")?"Smlouva":"Jiné";
    showSaveStatus("⏳ Nahrávám...", "#f97316");
    if(file.type.startsWith("image/")){
      // Compress image before saving
      var reader=new FileReader();
      reader.onload=function(e){
        var img=new Image();
        img.onload=function(){
          var canvas=document.createElement("canvas");
          var MAX=1200;
          var w=img.width, h=img.height;
          if(w>h&&w>MAX){h=Math.round(h*MAX/w);w=MAX;}
          else if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
          canvas.width=w; canvas.height=h;
          canvas.getContext("2d").drawImage(img,0,0,w,h);
          var compressed=canvas.toDataURL("image/jpeg",0.75);
          var sz=Math.round(compressed.length*0.75);
          mut(function(d){d.documents.push({id:uid(),name:file.name,type:type,date:today(),note:"",fileData:compressed,fileType:"image/jpeg",fileSize:sz})});
        };
        img.src=e.target.result;
      };
      reader.readAsDataURL(file);
    } else {
      // Non-image file — read as-is
      var reader=new FileReader();
      reader.onload=function(e){
        mut(function(d){d.documents.push({id:uid(),name:file.name,type:type,date:today(),note:"",fileData:e.target.result,fileType:file.type,fileSize:file.size})});
      };
      reader.readAsDataURL(file);
    }
  });
}
