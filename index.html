var AUTH={
  KEY:"sd_users",
  getUsers:function(){
    try{return JSON.parse(localStorage.getItem(this.KEY)||"[]")}catch(e){return[]}
  },
  saveUsers:function(users){localStorage.setItem(this.KEY,JSON.stringify(users))},
  addUser:function(username,password){
    var us=this.getUsers();
    if(us.find(function(x){return x.username===username}))return false;
    us.push({username:username,ph:this.hash(password),at:new Date().toISOString()});
    this.saveUsers(us);
    return true;
  },
  verify:function(username,password){
    var h=this.hash(password);
    return this.getUsers().find(function(x){return x.username===username&&x.ph===h});
  },
  hash:function(s){
    var h=0x811c9dc5;
    for(var i=0;i<s.length;i++){
      h^=s.charCodeAt(i);
      h=(h*0x01000193)>>>0;
    }
    return h.toString(16);
  },
  session:{
    get:function(){return localStorage.getItem("sd_session")},
    set:function(username){localStorage.setItem("sd_session",username)},
    clear:function(){localStorage.removeItem("sd_session")}
  }
};

/* GitHub úložiště. Formát GH_REPO je owner/repository. */
var GH_TOKEN=localStorage.getItem("sd_gh_token")||"";
var GH_REPO=localStorage.getItem("sd_gh_repo")||"mamadas-commits/index.html";
var GH_FILE=localStorage.getItem("sd_gh_file")||"sd-data.json";
var GH_SHA=localStorage.getItem("sd_gh_sha")||"";

function ghFilePath(){
  return String(GH_FILE||"sd-data.json")
    .split("/")
    .map(function(part){return encodeURIComponent(part)})
    .join("/");
}

function utf8ToBase64(str){
  var bytes=new TextEncoder().encode(str);
  var bin="";
  bytes.forEach(function(b){bin+=String.fromCharCode(b)});
  return btoa(bin);
}

function base64ToUtf8(b64){
  var bin=atob(String(b64||"").replace(/\n/g,""));
  var bytes=Uint8Array.from(bin,function(c){return c.charCodeAt(0)});
  return new TextDecoder().decode(bytes);
}

function ghFetch(method,path,body){
  if(!GH_TOKEN)return Promise.reject(new Error("Chybí GitHub token"));
  return fetch("https://api.github.com"+path,{
    method:method,
    headers:{
      "Authorization":"Bearer "+GH_TOKEN,
      "Accept":"application/vnd.github+json",
      "Content-Type":"application/json",
      "X-GitHub-Api-Version":"2022-11-28"
    },
    body:body?JSON.stringify(body):undefined
  }).then(function(r){
    return r.json().catch(function(){return {}}).then(function(d){
      if(!r.ok){
        var msg=d.message||("GitHub chyba "+r.status);
        if(r.status===401)msg="Neplatný nebo expirovaný GitHub token";
        if(r.status===403)msg="Token nemá oprávnění k repozitáři nebo je překročen limit GitHub API";
        if(r.status===404)msg="Repozitář nebo soubor nebyl nalezen";
        var err=new Error(msg);
        err.status=r.status;
        err.data=d;
        throw err;
      }
      return d;
    });
  });
}

var DB={
  load:function(username){
    return ghFetch("GET","/repos/"+GH_REPO+"/contents/"+ghFilePath())
      .then(function(file){
        GH_SHA=file.sha||"";
        localStorage.setItem("sd_gh_sha",GH_SHA);
        var raw=base64ToUtf8(file.content||"");
        var all=raw?JSON.parse(raw):{};
        return all[username]||DB.def();
      })
      .catch(function(e){
        if(String(e.message).includes("nebyl nalezen")||e.message==="Not Found")return DB.def();
        console.error("Load error",e);
        S.lastError=e.message;
        return DB.def();
      });
  },
  save:function(username,data){
    function isShaConflict(err){
      return err && (err.status===409 || /does not match|sha/i.test(err.message||""));
    }

    function readAllFresh(){
      return ghFetch("GET","/repos/"+GH_REPO+"/contents/"+ghFilePath())
        .then(function(file){
          GH_SHA=file.sha||"";
          localStorage.setItem("sd_gh_sha",GH_SHA);
          var raw=base64ToUtf8(file.content||"");
          return {all:raw?JSON.parse(raw):{},sha:GH_SHA};
        })
        .catch(function(err){
          if(err && err.status===404){
            GH_SHA="";
            localStorage.removeItem("sd_gh_sha");
            return {all:{},sha:""};
          }
          throw err;
        });
    }

    function writeAttempt(attempt){
      return readAllFresh()
        .then(function(current){
          current.all[username]=data;
          var content=utf8ToBase64(JSON.stringify(current.all,null,2));
          var payload={message:"Aktualizace dat Správce domu",content:content};
          if(current.sha)payload.sha=current.sha;
          return ghFetch("PUT","/repos/"+GH_REPO+"/contents/"+ghFilePath(),payload);
        })
        .then(function(res){
          if(res.content&&res.content.sha){
            GH_SHA=res.content.sha;
            localStorage.setItem("sd_gh_sha",GH_SHA);
          }
          return true;
        })
        .catch(function(err){
          if(isShaConflict(err) && attempt<3){
            return new Promise(function(resolve){setTimeout(resolve,250*attempt)})
              .then(function(){return writeAttempt(attempt+1)});
          }
          throw err;
        });
    }

    return writeAttempt(1)
      .catch(function(e){
        console.error("Save error",e);
        S.lastError=e.message;
        return false;
      });
  },
  def:function(){
    return{
      revisions:[

        {id:2,type:"Hromosvod",lastDate:"2022-11-10",intervalYears:4,company:"Bleskojist Praha",note:""},
        {id:3,type:"Hasicí přístroje",lastDate:"2024-01-20",intervalYears:1,company:"Požární technika Brno",note:"5x práškový, 2x CO₂"},
        {id:4,type:"Střecha / fasáda",lastDate:"2023-06-01",intervalYears:3,company:"",note:"Vizuální prohlídka"},
        {id:5,type:"Centrální vytápění - plyn",lastDate:"2024-02-14",intervalYears:1,company:"GasServis Pardubice",note:"Kotel Vaillant 24 kW"}
      ],
      contacts:[
        {id:1,name:"Elektro Novák s.r.o.",phone:"+420 466 123 456",email:"novak@elektro.cz",category:"Elektro",note:""},
        {id:2,name:"GasServis Pardubice",phone:"+420 466 654 321",email:"info@gasservis.cz",category:"Plyn/Topení",note:"Havarijní linka 24/7"},
        {id:3,name:"Požární technika Brno",phone:"+420 545 111 222",email:"revize@pozarni.cz",category:"Hasicí technika",note:""}
      ],
      defects:[
        {id:1,date:"2024-11-05",description:"Prasklina na fasádě – severní strana",status:"V řešení",cost:0,note:"Čeká se na nabídku"},
        {id:2,date:"2024-08-12",description:"Výměna ventilu na topení",status:"Vyřešeno",cost:1850,note:"GasServis fa 2024/445"}
      ],
      finances:[
        {id:1,date:"2024-02-14",description:"Revize kotle",category:"Revize",amount:3200},
        {id:2,date:"2024-01-20",description:"Revize hasicích přístrojů",category:"Revize",amount:2100},
        {id:3,date:"2024-08-12",description:"Oprava ventilu topení",category:"Oprava",amount:1850}
      ],
      documents:[
        {id:1,name:"Revizní zpráva elektro 2023.pdf",type:"Revizní zpráva",date:"2023-03-15",note:"Platí do 2028",fileData:null,fileType:null,fileSize:null}
      ]
    };
  }
};

var uid=function(){return Date.now()+Math.floor(Math.random()*9999)};

var esc=function(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")};
var fmtSize=function(b){b=Number(b||0);return b>1048576?(b/1048576).toFixed(1)+" MB":b>1024?Math.round(b/1024)+" KB":b+" B"};
var money=function(v){return Number(v||0).toLocaleString("cs-CZ")+" Kč"};

var MAX_ONE_FILE=2*1024*1024;
var MAX_ALL_FILES=8*1024*1024;
var MAX_INPUT_IMAGE=10*1024*1024;

function docsTotalSize(){
  return (S.data&&S.data.documents?S.data.documents:[]).reduce(function(sum,d){return sum+(Number(d.fileSize)||0)},0);
}

function canStoreFile(size,kind){
  if(kind==="image-input"&&size>MAX_INPUT_IMAGE){
    alert("Fotka je příliš velká. Maximum pro vstupní fotku je "+fmtSize(MAX_INPUT_IMAGE)+".");
    return false;
  }
  if(kind!=="image-input"&&size>MAX_ONE_FILE){
    alert("Soubor je příliš velký. Maximum pro jeden soubor je "+fmtSize(MAX_ONE_FILE)+".");
    return false;
  }
  if(kind!=="image-input"&&docsTotalSize()+size>MAX_ALL_FILES){
    alert("Úložiště dokumentů je příliš velké. Doporučuji starší soubory stáhnout a smazat, nebo dokumenty ukládat mimo JSON.");
    return false;
  }
  return true;
}

var S={
  tab:"dashboard",
  data:null,
  df:"Vše",
  fy:new Date().getFullYear(),
  sq:"",
  user:null,
  aMode:"login",
  aErr:"",
  setupErr:"",
  lastError:""
};
var svT=null;
var saveChain=Promise.resolve();

function showLoading(on,msg){
  var el=document.getElementById("ld");
  if(on&&!el){
    el=document.createElement("div");
    el.id="ld";
    el.style.cssText="position:fixed;inset:0;background:#0f1117;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:16px";
    el.innerHTML="<div style='font-size:48px'>🏢</div><div style='color:#4f8ef7;font-size:16px;font-weight:600'>"+esc(msg||"Načítám data...")+"</div>";
    document.body.appendChild(el);
  }else if(on&&el){
    el.querySelector("div:last-child").textContent=msg||"Načítám data...";
  }else if(!on&&el){
    el.remove();
  }
}

function showSaveStatus(msg,color){
  var sv=document.getElementById("sv");
  if(sv){
    sv.style.color=color||"#22c55e";
    sv.textContent=msg;
    sv.style.opacity="1";
  }
}

function mut(fn){
  if(!S.data)return;
  fn(S.data);
  showSaveStatus("⏳ Ukládám...","#f97316");
  clearTimeout(svT);
  svT=setTimeout(function(){
    var snapshot=JSON.parse(JSON.stringify(S.data));
    saveChain=saveChain.catch(function(){return true}).then(function(){
      return DB.save(S.user,snapshot);
    }).then(function(ok){
      var sv=document.getElementById("sv");
      if(sv){
        sv.style.color=ok?"#22c55e":"#ef4444";
        sv.textContent=ok?"✓ Uloženo":"⚠ "+(S.lastError||"Chyba ukládání na GitHub");
        sv.style.opacity="1";
        setTimeout(function(){if(sv)sv.style.opacity="0"},4000);
      }
      if(!ok)render();
      return ok;
    });
  },600);
  render();
}

function setTab(t){S.tab=t;window.scrollTo(0,0);render()}
function logout(){AUTH.session.clear();S.user=null;S.data=null;S.aErr="";render()}
function resetSetup(){localStorage.removeItem("sd_gh_token");localStorage.removeItem("sd_gh_sha");GH_TOKEN="";GH_SHA="";logout()}
function g(id){var el=document.getElementById(id);return el?el.value:""}
function badge(s){var x=ST[s]||ST.ok;return "<span class='chip' style='background:"+x.bg+";color:"+x.color+";border:1px solid "+x.color+"33'>"+x.icon+" "+x.label+"</span>"}
function lbl(t){return "<label style='color:#64748b;font-size:12px;margin-top:4px'>"+esc(t)+"</label>"}
function inp(id,ph,type,val){return "<input id='"+id+"' style='"+IS+"' placeholder='"+esc(ph||"")+"' type='"+(type||"text")+"' value='"+esc(val||"")+"'/>"}
function ta(id,ph,val){return "<textarea id='"+id+"' style='"+IS+"resize:vertical;' rows='3' placeholder='"+esc(ph||"")+"'>"+esc(val||"")+"</textarea>"}
function sel(id,opts,val){return "<select id='"+id+"' style='"+IS+"'>"+opts.map(function(o){return "<option value='"+esc(o)+"'"+(o===val?" selected":"")+">"+esc(o)+"</option>"}).join("")+"</select>"}

function initSession(){
  var username=AUTH.session.get();
  if(username&&AUTH.getUsers().find(function(x){return x.username===username})){
    S.user=username;
    showLoading(true);
    return DB.load(username).then(function(data){S.data=data;showLoading(false)});
  }
  return Promise.resolve();
}

        <button onclick='saveSetup()' style='"+BS("primary")+"width:100%;'>Uložit a pokračovat</button>\

      <div style='color:#64748b;font-size:11px;text-align:center;margin-top:14px;line-height:1.45'>Token se uloží pouze v tomto prohlížeči. Pro produkční provoz SVJ je bezpečnější použít vlastní backend.</div>\
    </div>\
  </div>";
  setTimeout(function(){var el=document.getElementById("setup-token");if(el)el.focus()},50);
}

function saveSetup(){
  var token=(document.getElementById("setup-token")||{value:""}).value.trim();
  var repo=(document.getElementById("setup-repo")||{value:""}).value.trim();
  var file=(document.getElementById("setup-file")||{value:""}).value.trim()||"sd-data.json";
  var okPrefix=token.startsWith("ghp_")||token.startsWith("github_pat_")||token.startsWith("gho_")||token.startsWith("ghu_");
  if(!token||!okPrefix){S.setupErr="Zadej platný GitHub token. Classic token začíná ghp_, fine-grained token obvykle github_pat_.";render();return}
  if(!repo||repo.indexOf("/")<1){S.setupErr="Repozitář musí být ve tvaru vlastník/repozitář.";render();return}
  GH_TOKEN=token;GH_REPO=repo;GH_FILE=file;S.setupErr="";
  localStorage.setItem("sd_gh_token",token);
  localStorage.setItem("sd_gh_repo",repo);
  localStorage.setItem("sd_gh_file",file);
  render();
}

function showAuthErr(msg){S.aErr=msg;render()}
function doLogin(){
  var username=(document.getElementById("au")||{value:""}).value.trim();
  var password=(document.getElementById("ap")||{value:""}).value;
  if(!username||!password){showAuthErr("Vyplňte uživatelské jméno a heslo");return}
  if(!AUTH.verify(username,password)){showAuthErr("Nesprávné jméno nebo heslo");return}
  AUTH.session.set(username);
  S.user=username;
  S.aErr="";
  showLoading(true);
  DB.load(username).then(function(data){S.data=data;showLoading(false);render()});
}
function doReg(){
  var username=(document.getElementById("au")||{value:""}).value.trim();
  var password=(document.getElementById("ap")||{value:""}).value;
  var password2=(document.getElementById("ap2")||{value:""}).value;
  if(!username||!password){showAuthErr("Vyplňte všechna pole");return}
  if(username.length<3){showAuthErr("Jméno musí mít alespoň 3 znaky");return}
  if(password.length<4){showAuthErr("Heslo musí mít alespoň 4 znaky");return}
  if(password!==password2){showAuthErr("Hesla se neshodují");return}
  if(!AUTH.addUser(username,password)){showAuthErr("Toto uživatelské jméno je již obsazeno");return}
  AUTH.session.set(username);
  S.user=username;
  S.aErr="";
  showLoading(true);
  DB.load(username).then(function(data){S.data=data;showLoading(false);render()});
}

    (docs.length?docs.map(function(d){var cl=tc[d.type]||"#4f8ef7";return "<div class='card'><div style='display:flex;justify-content:space-between;align-items:flex-start'><div style='display:flex;gap:12px;align-items:flex-start;flex:1;min-width:0'><span style='font-size:26px;flex-shrink:0'>"+(d.fileData?icon(d.fileType):"📄")+"</span><div style='min-width:0;flex:1'><div style='color:#e2e8f0;font-weight:600;font-size:15px;word-break:break-word'>"+esc(d.name)+"</div><div style='display:flex;gap:8px;margin-top:5px;align-items:center;flex-wrap:wrap'><span class='chip' style='background:"+cl+"22;color:"+cl+"'>"+esc(d.type)+"</span><span style='color:#64748b;font-size:12px'>"+fmt(d.date)+"</span>"+(d.fileSize?"<span style='color:#64748b;font-size:11px'>"+fmtSize(d.fileSize)+"</span>":"")+"</div>"+(d.note?"<div style='color:#64748b;font-size:12px;margin-top:6px;font-style:italic'>"+esc(d.note)+"</div>":"")+"</div></div><div style='display:flex;gap:6px;margin-left:8px;flex-shrink:0'>"+(d.fileData?"<button style='"+BS("success")+"padding:6px 10px;font-size:13px' onclick='dlDoc("+d.id+")' title='Stáhnout'>⬇</button>":"")+"<button style='"+BS("danger")+"padding:6px 10px;font-size:13px' onclick='del(\"documents\","+d.id+")'>✕</button></div></div></div>"}).join(""):"<div class='empty'>Žádné dokumenty.</div>");
}

function handleDrop(e){
  e.preventDefault();
  if(e.currentTarget)e.currentTarget.classList.remove("over");
  processFiles(Array.from(e.dataTransfer.files||[]));
}
function handleFileInput(input){processFiles(Array.from(input.files||[]));input.value=""}
function guessDocType(fileName){
  var n=String(fileName||"").toLowerCase();
  if(n.includes("reviz"))return "Revizní zpráva";
  if(n.includes("protokol"))return "Protokol";
  if(n.includes("smlouva")||n.includes("pojist"))return "Smlouva";
  if(n.includes("projekt"))return "Projektová dokumentace";
  return "Jiné";
}
function addDocumentRecord(file, fileData, fileType, fileSize){
  if(!canStoreFile(fileSize,"stored"))return;
  var doc={id:uid(),name:file.name,type:guessDocType(file.name),date:today(),note:"",fileData:fileData,fileType:fileType||file.type||"application/octet-stream",fileSize:fileSize};
  mut(function(d){d.documents.push(doc)});
}
function processFiles(files){
  files.forEach(function(file){
    if(!file)return;
    showSaveStatus("⏳ Nahrávám...","#f97316");
    if(file.type&&file.type.startsWith("image/")){
      if(!canStoreFile(file.size,"image-input"))return;
      var reader=new FileReader();
      reader.onload=function(ev){
        var img=new Image();
        img.onload=function(){
          var canvas=document.createElement("canvas");
          var max=1200;
          var w=img.width,h=img.height;
          if(w>h&&w>max){h=Math.round(h*max/w);w=max}else if(h>max){w=Math.round(w*max/h);h=max}
          canvas.width=w;canvas.height=h;
          canvas.getContext("2d").drawImage(img,0,0,w,h);
          var compressed=canvas.toDataURL("image/jpeg",0.75);
          var size=Math.round(compressed.length*0.75);
          addDocumentRecord(file,compressed,"image/jpeg",size);
        };
        img.onerror=function(){alert("Fotku se nepodařilo načíst.")};
        img.src=ev.target.result;
      };
      reader.readAsDataURL(file);
    }else{
      if(!canStoreFile(file.size,"file"))return;
      var reader2=new FileReader();
      reader2.onload=function(ev){addDocumentRecord(file,ev.target.result,file.type,file.size)};
      reader2.readAsDataURL(file);
    }
  });
}
function dlDoc(id){var d=(S.data.documents||[]).find(function(x){return x.id===id});if(!d||!d.fileData)return;var a=document.createElement("a");a.href=d.fileData;a.download=d.name||"dokument";a.click()}

  return "<div id='mb' onclick='if(event.target.id===\"mb\")closeM()' style='position:fixed;inset:0;background:#000c;display:flex;align-items:flex-end;justify-content:center;z-index:1000'>"+
    "<div style='background:#1a1d27;border:1px solid #2a2f45;border-radius:20px 20px 0 0;padding:24px 20px 36px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto'>"+
    "<div style='width:40px;height:4px;background:#2a2f45;border-radius:2px;margin:0 auto 16px'></div>"+
    "<h3 style='color:#e2e8f0;margin-bottom:16px;font-weight:700;font-size:18px'>"+esc(title)+"</h3>"+
    "<div style='display:flex;flex-direction:column;gap:10px'>"+body+"</div>"+
    "<div style='display:flex;gap:10px;margin-top:16px'><button style='"+BS("primary")+"flex:1' onclick='"+submit+"'>Uložit</button><button style='"+BS("ghost")+"flex:1' onclick='closeM()'>Zrušit</button></div></div></div>";
}

  else if(type==="con-new")html=mWrap("Nový kontakt",inp("fn2","Název / jméno *")+inp("fp","Telefon","tel")+inp("fe","E-mail","email")+inp("fk","Kategorie")+ta("fno","Poznámka"),"saveCon(null)");
  else if(type==="con-edit"){var c=d.contacts.find(function(x){return x.id===id});if(!c)return;html=mWrap("Upravit kontakt",inp("fn2","Název *","text",c.name)+inp("fp","Telefon","tel",c.phone)+inp("fe","E-mail","email",c.email)+inp("fk","Kategorie","text",c.category)+ta("fno","Poznámka",c.note),"saveCon("+id+")")}
  else if(type==="def-new")html=mWrap("Nová závada",lbl("Datum")+inp("fd2","","date",today())+ta("fde","Popis závady *")+sel("fst",["Nová","V řešení","Vyřešeno"],"Nová")+inp("fco","Náklady (Kč)","number","0")+ta("fno2","Poznámka"),"saveDef(null)");
  else if(type==="def-edit"){var x=d.defects.find(function(x){return x.id===id});if(!x)return;html=mWrap("Upravit závadu",lbl("Datum")+inp("fd2","","date",x.date)+ta("fde","Popis *",x.description)+sel("fst",["Nová","V řešení","Vyřešeno"],x.status)+inp("fco","Náklady (Kč)","number",x.cost)+ta("fno2","Poznámka",x.note),"saveDef("+id+")")}
  else if(type==="fin-new")html=mWrap("Nový výdaj",lbl("Datum")+inp("fd3","","date",today())+inp("fde2","Popis *")+sel("fca",["Revize","Oprava","Správa","Energie","Pojištění","Jiné"],"Revize")+inp("fam","Částka (Kč) *","number"),"saveFin()");
  else if(type==="doc-new")html=mWrap("Nový záznam bez souboru",inp("fna","Název dokumentu *")+sel("fty",["Revizní zpráva","Protokol","Smlouva","Projektová dokumentace","Pojistná smlouva","Jiné"],"Revizní zpráva")+lbl("Datum dokumentu")+inp("fd4","","date",today())+inp("fno3","Poznámka (platnost, číslo...)","text"),"saveDoc()");
  var el=document.createElement("div");el.id="modal-root";el.innerHTML=html;document.body.appendChild(el);
}
function closeM(){var e=document.getElementById("modal-root");if(e)e.remove()}
function saveRev(id){var t=g("ft").trim();if(!t)return;var rec={type:t,lastDate:g("fd")||today(),intervalYears:Number(g("fi2"))||1,company:g("fc"),note:g("fn")};mut(function(d){if(id)d.revisions=d.revisions.map(function(x){return x.id===id?Object.assign({},x,rec):x});else d.revisions.push(Object.assign({id:uid()},rec))});closeM()}
function saveCon(id){var n=g("fn2").trim();if(!n)return;var rec={name:n,phone:g("fp"),email:g("fe"),category:g("fk"),note:g("fno")};mut(function(d){if(id)d.contacts=d.contacts.map(function(x){return x.id===id?Object.assign({},x,rec):x});else d.contacts.push(Object.assign({id:uid()},rec))});closeM()}
function saveDef(id){var desc=g("fde").trim();if(!desc)return;var rec={date:g("fd2")||today(),description:desc,status:g("fst")||"Nová",cost:Number(g("fco"))||0,note:g("fno2")};mut(function(d){if(id)d.defects=d.defects.map(function(x){return x.id===id?Object.assign({},x,rec):x});else d.defects.push(Object.assign({id:uid()},rec))});closeM()}
function saveFin(){var desc=g("fde2").trim(),amt=Number(g("fam"));if(!desc||!amt)return;mut(function(d){d.finances.push({id:uid(),date:g("fd3")||today(),description:desc,category:g("fca")||"Jiné",amount:amt})});closeM()}
function saveDoc(){var n=g("fna").trim();if(!n)return;mut(function(d){d.documents.push({id:uid(),name:n,type:g("fty")||"Jiné",date:g("fd4")||today(),note:g("fno3"),fileData:null,fileType:null,fileSize:null})});closeM()}
function del(col,id){
  var el=document.createElement("div");
  el.id="confirm-root";
  el.innerHTML="<div onclick='if(event.target===this)this.remove()' style='position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px'><div style='background:#1a1d27;border:1px solid #ef444444;border-radius:16px;padding:24px 22px;width:100%;max-width:320px;text-align:center'><div style='font-size:36px;margin-bottom:12px'>🗑️</div><div style='color:#e2e8f0;font-size:17px;font-weight:700;margin-bottom:6px'>Smazat položku?</div><div style='color:#64748b;font-size:14px;margin-bottom:22px'>Tuto akci nelze vrátit zpět.</div><div style='display:flex;gap:10px'><button onclick='document.getElementById(\"confirm-root\").remove()' style='flex:1;background:transparent;color:#94a3b8;border:1px solid #2a2f45;border-radius:10px;padding:11px;font-size:15px;font-weight:600;cursor:pointer'>Zrušit</button><button id='confirm-yes' style='flex:1;background:#7f1d1d;color:#ef4444;border:1px solid #ef444444;border-radius:10px;padding:11px;font-size:15px;font-weight:600;cursor:pointer'>Smazat</button></div></div></div>";
  document.body.appendChild(el);

}
